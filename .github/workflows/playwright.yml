name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        type: choice
        options:
          - smoke
          - test
        default: smoke
      test_filter:
        description: Optional Playwright grep filter (for suite 'test', e.g. TC-001)
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      WEBSITE_URL: ${{ vars.WEBSITE_URL || 'https://opensource-demo.orangehrmlive.com/' }}
      WEBSITE_USER: ${{ secrets.WEBSITE_USER }}
      WEBSITE_PASSWORD: ${{ secrets.WEBSITE_PASSWORD }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Verify required secrets
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'test')
      run: |
        test -n "$WEBSITE_USER" || { echo "::error::Add WEBSITE_USER in GitHub Actions secrets."; exit 1; }
        test -n "$WEBSITE_PASSWORD" || { echo "::error::Add WEBSITE_PASSWORD in GitHub Actions secrets."; exit 1; }
    - name: Run smoke tests for pull requests and pushes
      if: github.event_name == 'pull_request' || github.event_name == 'push'
      run: npx playwright test tests/specs --workers=1 --grep "@smoke"
    - name: Run full regression suite
      if: github.event_name == 'schedule'
      run: npx playwright test tests/specs --workers=1
    - name: Run selected test(s)
      if: github.event_name == 'workflow_dispatch' && inputs.suite == 'test'
      env:
        TEST_FILTER: ${{ inputs.test_filter }}
      run: |
        if [ -z "$TEST_FILTER" ]; then
          echo "::error::Enter a test_filter such as TC-001 or a test title."
          exit 1
        fi
        npx playwright test tests/specs --workers=1 --grep "$TEST_FILTER"
    - name: Run smoke suite manually
      if: github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke'
      run: npx playwright test tests/specs --workers=1 --grep "@smoke"
    - uses: actions/upload-artifact@v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
